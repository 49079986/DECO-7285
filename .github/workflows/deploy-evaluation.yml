name: Deploy FriendZone evaluation

on:
  push:
    branches: [main]
    paths:
      - "evaluation/**"
      - "scripts/write-evaluation-config.mjs"
      - ".github/workflows/deploy-evaluation.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate public Supabase configuration
        run: node scripts/write-evaluation-config.mjs
        env:
          EVALUATION_SUPABASE_URL: ${{ secrets.EVALUATION_SUPABASE_URL }}
          EVALUATION_SUPABASE_ANON_KEY: ${{ secrets.EVALUATION_SUPABASE_ANON_KEY }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload evaluation site
        uses: actions/upload-pages-artifact@v3
        with:
          path: evaluation

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

